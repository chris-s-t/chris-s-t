<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070714"/>
      <stop offset="55%" stop-color="#11112b"/>
      <stop offset="100%" stop-color="#1d1842"/>
    </linearGradient>
    <linearGradient id="portalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes floatRune {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes flame {
        0%, 100% { transform: scaleY(1) translateY(0px); opacity: 0.95; }
        50% { transform: scaleY(1.25) translateY(-3px); opacity: 1; }
      }
      @keyframes sparkRise {
        0% { transform: translateY(0px) translateX(0px); opacity: 1; }
        100% { transform: translateY(-45px) translateX(8px); opacity: 0; }
      }
      @keyframes sparkRiseLeft {
        0% { transform: translateY(0px) translateX(0px); opacity: 1; }
        100% { transform: translateY(-40px) translateX(-10px); opacity: 0; }
      }
      @keyframes portalPulse {
        0%, 100% { opacity: 0.7; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes heroBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes shootingStar {
        0% { transform: translateX(0px) translateY(0px); opacity: 0; }
        10% { opacity: 1; }
        35% { transform: translateX(-220px) translateY(90px); opacity: 0; }
        100% { transform: translateX(-220px) translateY(90px); opacity: 0; }
      }
      .star-a { animation: twinkle 3s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .star-b { animation: twinkle 4.2s infinite ease-in-out 1.4s; transform-box: fill-box; transform-origin: center; }
      .star-c { animation: twinkle 2.4s infinite ease-in-out 0.7s; transform-box: fill-box; transform-origin: center; }
      .rune-float { animation: floatRune 3.6s infinite ease-in-out; }
      .rune-float-delayed { animation: floatRune 4s infinite ease-in-out 1.5s; }
      .fire-main { animation: flame 0.8s infinite ease-in-out; transform-box: fill-box; transform-origin: bottom center; }
      .spark-1 { animation: sparkRise 2.2s infinite ease-out; }
      .spark-2 { animation: sparkRiseLeft 2.7s infinite ease-out 0.8s; }
      .spark-3 { animation: sparkRise 1.9s infinite ease-out 1.3s; }
      .portal-core { animation: portalPulse 3s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .hero-sprite { animation: heroBob 1.2s infinite steps(2); }
      .cursor-blink { animation: cursorBlink 1s infinite; }
      .meteor { animation: shootingStar 7s infinite ease-out 2s; }
      .pixel-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
      .ui-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="280" rx="12" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e2e8f0">
    <rect x="70" y="35" width="3" height="3" class="star-a"/>
    <rect x="145" y="75" width="2" height="2" class="star-b"/>
    <rect x="230" y="28" width="4" height="4" fill="#fef08a" class="star-c"/>
    <rect x="330" y="60" width="3" height="3" class="star-a"/>
    <rect x="420" y="25" width="2" height="2" class="star-b"/>
    <rect x="520" y="45" width="3" height="3" class="star-c"/>
    <rect x="610" y="22" width="4" height="4" fill="#bae6fd" class="star-a"/>
    <rect x="780" y="55" width="3" height="3" class="star-b"/>
    <rect x="845" y="30" width="2" height="2" class="star-c"/>
    <rect x="480" y="95" width="2" height="2" class="star-a"/>
  </g>

  <!-- Shooting Star -->
  <g class="meteor">
    <line x1="650" y1="15" x2="685" y2="0" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <rect x="648" y="14" width="4" height="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Crescent Pixel Moon -->
  <g transform="translate(750, 32)">
    <circle cx="28" cy="28" r="24" fill="#fef08a" filter="url(#glow)" opacity="0.9"/>
    <circle cx="38" cy="22" r="20" fill="#0d0e24"/>
    <rect x="14" y="24" width="4" height="4" fill="#fde047" opacity="0.5"/>
    <rect x="22" y="36" width="6" height="4" fill="#fde047" opacity="0.5"/>
  </g>

  <!-- Far Mountains Silhouette -->
  <polygon points="0,240 0,175 65,130 135,180 220,115 310,175 395,135 480,185 575,120 670,175 755,140 840,180 900,145 900,240" fill="#12112a"/>
  
  <!-- Midground Pixel Hills -->
  <polygon points="0,245 0,195 95,165 185,200 290,160 410,205 530,168 640,200 760,165 900,195 900,245" fill="#181636"/>

  <!-- Ancient Discovery Monolith / Portal on the Right -->
  <g transform="translate(650, 108)">
    <rect x="18" y="12" width="68" height="110" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <rect x="12" y="6" width="80" height="12" rx="2" fill="#312e81"/>
    <rect x="8" y="114" width="88" height="10" rx="2" fill="#312e81"/>
    <rect x="26" y="22" width="52" height="92" rx="26" fill="url(#portalGlow)" class="portal-core" filter="url(#glow)"/>
    <rect x="36" y="34" width="32" height="68" rx="16" fill="#e0e7ff" opacity="0.65" class="portal-core"/>
    <g class="rune-float" filter="url(#glow)">
      <text x="-22" y="35" fill="#38bdf8" font-size="13" class="pixel-text">&lt;/&gt;</text>
      <text x="96" y="55" fill="#c084fc" font-size="13" class="pixel-text">{AI}</text>
      <rect x="49" y="-12" width="6" height="6" fill="#38bdf8" transform="rotate(45 52 -9)"/>
    </g>
    <g class="rune-float-delayed" filter="url(#glow)">
      <text x="-22" y="85" fill="#a855f7" font-size="12" class="pixel-text">&#955;</text>
      <text x="98" y="92" fill="#38bdf8" font-size="12" class="pixel-text">01</text>
    </g>
  </g>

  <!-- Ground Terrain -->
  <rect x="0" y="228" width="900" height="52" fill="#0d0b1e"/>
  <rect x="0" y="228" width="900" height="5" fill="#2e295e"/>
  <g fill="#4c438a">
    <rect x="45" y="228" width="24" height="5"/>
    <rect x="160" y="228" width="40" height="5"/>
    <rect x="360" y="228" width="18" height="5"/>
    <rect x="440" y="228" width="50" height="5"/>
    <rect x="590" y="228" width="30" height="5"/>
    <rect x="780" y="228" width="45" height="5"/>
  </g>

  <!-- Campfire Checkpoint -->
  <g transform="translate(555, 204)">
    <rect x="2" y="18" width="28" height="6" rx="2" fill="#78350f" transform="rotate(-12 16 21)"/>
    <rect x="2" y="18" width="28" height="6" rx="2" fill="#92400e" transform="rotate(14 16 21)"/>
    <circle cx="16" cy="12" r="22" fill="#f97316" opacity="0.22" filter="url(#glow)"/>
    <g class="fire-main">
      <polygon points="6,20 16,-4 26,20" fill="#f97316"/>
      <polygon points="10,20 16,3 22,20" fill="#facc15"/>
      <polygon points="13,20 16,10 19,20" fill="#fef08a"/>
    </g>
    <rect x="14" y="4" width="3" height="3" fill="#fde047" class="spark-1"/>
    <rect x="18" y="6" width="3" height="3" fill="#fb923c" class="spark-2"/>
    <rect x="11" y="2" width="2" height="2" fill="#fef08a" class="spark-3"/>
  </g>

  <!-- RPG Explorer Character + Owl Companion -->
  <g transform="translate(475, 178)">
    <g class="hero-sprite">
    <ellipse cx="20" cy="51" rx="16" ry="4" fill="#05050d" opacity="0.7"/>
    <rect x="10" y="20" width="20" height="22" rx="2" fill="#2563eb"/>
    <polygon points="6,42 12,20 26,20 30,42" fill="#1d4ed8"/>
    <rect x="9" y="18" width="22" height="5" rx="2" fill="#ef4444"/>
    <rect x="4" y="20" width="7" height="10" rx="1" fill="#dc2626"/>
    <rect x="11" y="4" width="18" height="15" rx="3" fill="#fcd34d"/>
    <rect x="10" y="2" width="20" height="6" rx="2" fill="#1e293b"/>
    <rect x="10" y="4" width="4" height="9" fill="#1e293b"/>
    <rect x="21" y="10" width="3" height="4" fill="#0f172a"/>
    <rect x="26" y="10" width="3" height="4" fill="#0f172a"/>
    <rect x="12" y="42" width="6" height="8" fill="#475569"/>
    <rect x="22" y="42" width="6" height="8" fill="#475569"/>
    <line x1="8" y1="36" x2="28" y2="-4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

    <g transform="translate(-26, -8)">
    <g class="rune-float">
      <rect x="2" y="4" width="14" height="12" rx="4" fill="#a855f7"/>
      <rect x="4" y="8" width="10" height="7" rx="2" fill="#e9d5ff"/>
      <rect x="4" y="5" width="4" height="4" fill="#fef08a"/>
      <rect x="10" y="5" width="4" height="4" fill="#fef08a"/>
      <rect x="5" y="6" width="2" height="2" fill="#0f172a"/>
      <rect x="11" y="6" width="2" height="2" fill="#0f172a"/>
      <polygon points="8,8 10,8 9,11" fill="#f97316"/>
    </g></g>
  </g></g>

  <!-- RPG HUD Card (Left Side) -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="405" height="182" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-width="2"/>
    <rect x="4" y="4" width="397" height="174" rx="6" fill="none" stroke="#1e293b" stroke-width="1"/>

    <rect x="-2" y="-2" width="8" height="8" fill="#38bdf8"/>
    <rect x="399" y="-2" width="8" height="8" fill="#38bdf8"/>
    <rect x="-2" y="176" width="8" height="8" fill="#38bdf8"/>
    <rect x="399" y="176" width="8" height="8" fill="#38bdf8"/>

    <text x="18" y="32" fill="#f8fafc" font-size="16" font-weight="bold" class="pixel-text">PLAYER: CHRISTIAN SURYA T.</text>
    <text x="18" y="52" fill="#38bdf8" font-size="11.5" class="pixel-text">CLASS : GAME DEV &amp; AI EXPLORER</text>

    <text x="18" y="78" fill="#94a3b8" font-size="11" class="pixel-text">CURIOSITY</text>
    <rect x="105" y="68" width="195" height="11" rx="3" fill="#1e293b"/>
    <rect x="105" y="68" width="195" height="11" rx="3" fill="url(#hpGrad)"/>
    <text x="310" y="78" fill="#f8fafc" font-size="11" class="pixel-text">MAX</text>

    <text x="18" y="98" fill="#94a3b8" font-size="11" class="pixel-text">EXP / LVL</text>
    <rect x="105" y="88" width="195" height="11" rx="3" fill="#1e293b"/>
    <rect x="105" y="88" width="165" height="11" rx="3" fill="url(#expGrad)"/>
    <text x="310" y="98" fill="#38bdf8" font-size="11" class="pixel-text">LVL 99</text>

    <line x1="18" y1="112" x2="385" y2="112" stroke="#1e293b" stroke-width="1.5"/>

    <text x="18" y="132" fill="#facc15" font-size="11.5" class="pixel-text">ACTIVE QUESTS:</text>
    <text x="22" y="151" fill="#e2e8f0" font-size="11.5" class="ui-text">&#8226; Reverse-engineering how systems work &amp; break</text>
    <text x="22" y="169" fill="#cbd5e1" font-size="11.5" class="ui-text">&#8226; Crafting worlds in Unity/Roblox &amp; training AI</text>
  </g>

  <!-- Bottom RPG Dialogue Bar -->
  <g transform="translate(28, 238)">
    <rect x="0" y="0" width="844" height="32" rx="6" fill="#090d16" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="21" fill="#38bdf8" font-size="12.5" class="pixel-text">[LOG]</text>
    <text x="68" y="21" fill="#f1f5f9" font-size="12.5" class="pixel-text">Exploring new realms in Machine Learning, Full-Stack Web &amp; Game Systems...</text>
    <polygon points="822,12 832,12 827,20" fill="#facc15" class="cursor-blink"/>
  </g>
</svg>