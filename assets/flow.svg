<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090a1a" />
      <stop offset="50%" stop-color="#131633" />
      <stop offset="100%" stop-color="#090a1a" />
    </linearGradient>
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatGem {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .path-line { stroke-dasharray: 8 6; animation: dashFlow 2s linear infinite; }
      .node-pulse { animation: pulseNode 2.5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .gem-float { animation: floatGem 3s infinite ease-in-out; }
      .pixel-font { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    </style>
  </defs>

  <rect width="900" height="110" rx="10" fill="url(#bgTrack)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Map Path -->
  <line x1="90" y1="46" x2="810" y2="46" stroke="#38bdf8" stroke-width="3" class="path-line" opacity="0.65" />

  <!-- Node 1: Game Dev -->
  <g transform="translate(130, 46)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#22c55e" stroke-width="3" class="node-pulse" />
    <rect x="-5" y="-5" width="10" height="10" fill="#22c55e" />
    <text x="0" y="38" text-anchor="middle" fill="#e2e8f0" font-size="11" class="pixel-font">STAGE 1: GAME DEV</text>
  </g>

  <!-- Node 2: Web & Mobile -->
  <g transform="translate(345, 46)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3" class="node-pulse" />
    <rect x="-5" y="-5" width="10" height="10" fill="#38bdf8" />
    <text x="0" y="38" text-anchor="middle" fill="#e2e8f0" font-size="11" class="pixel-font">STAGE 2: WEB & MOBILE</text>
  </g>

  <!-- Node 3: Machine Learning -->
  <g transform="translate(560, 46)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="3" class="node-pulse" />
    <rect x="-5" y="-5" width="10" height="10" fill="#a855f7" />
    <text x="0" y="38" text-anchor="middle" fill="#e2e8f0" font-size="11" class="pixel-font">STAGE 3: AI & ML</text>
  </g>

  <!-- Node 4: Uncharted Frontier -->
  <g transform="translate(770, 46)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#facc15" stroke-width="3" class="node-pulse" />
    <polygon points="0,-10 8,0 0,10 -8,0" fill="#facc15" class="gem-float" />
    <text x="0" y="38" text-anchor="middle" fill="#facc15" font-size="11" class="pixel-font">NEXT: NEW FRONTIERS [?]</text>
  </g>
</svg>